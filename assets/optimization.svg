<polyline points="80.00,341.00 205.83,341.00 331.67,341.00 457.50,341.00 583.33,341.00 709.17,186.35 835.00,186.35" fill="none" stroke="#251f21" stroke-width="3" stroke-dasharray="6 3"/>
