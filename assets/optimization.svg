<text x="43" y="346.0" font-size="14" font-weight="400">0.4</text>
<line x1="80" x2="835" y1="287.0" y2="287.0" stroke="#eae9ea"/>
<text x="43" y="292.0" font-size="14" font-weight="400">0.6</text>
<line x1="80" x2="835" y1="232.99999999999997" y2="232.99999999999997" stroke="#eae9ea"/>
<text x="43" y="237.99999999999997" font-size="14" font-weight="400">0.8</text>
<line x1="80" x2="835" y1="179.0" y2="179.0" stroke="#eae9ea"/>
<text x="43" y="184.0" font-size="14" font-weight="400">1.0</text>
<line x1="80" x2="835" y1="125.0" y2="125.0" stroke="#eae9ea"/>
<text x="43" y="130.0" font-size="14" font-weight="400">1.2</text>
<text x="75.0" y="417" font-size="14" font-weight="400">3</text>
<text x="200.83333333333331" y="417" font-size="14" font-weight="400">4</text>
<text x="326.66666666666663" y="417" font-size="14" font-weight="400">5</text>
<text x="452.5" y="417" font-size="14" font-weight="400">6</text>
<text x="578.3333333333333" y="417" font-size="14" font-weight="400">7</text>
<text x="704.1666666666667" y="417" font-size="14" font-weight="400">8</text>
<text x="830.0" y="417" font-size="14" font-weight="400">9</text>
<text x="300" y="443" font-size="15" font-weight="400">Total objective evaluations (including 3 shared initial)</text>
<text x="40" y="104" font-size="15" font-weight="400">Best observed objective (unitless)</text>
<line x1="80" x2="835" y1="166.65932807121385" y2="166.65932807121385" stroke="#585254" stroke-dasharray="4 4"/>
<text x="85" y="156.65932807121385" font-size="14" font-weight="400">Report-only grid oracle 1.045706</text>
<polyline points="80.00,341.00 205.83,186.35 331.67,186.35 457.50,186.35 583.33,186.35 709.17,166.70 835.00,166.70" fill="none" stroke="#34715f" stroke-width="3" stroke-dasharray=""/>
<circle cx="80.00" cy="341.00" r="3.5" fill="#34715f"/>
<circle cx="205.83" cy="186.35" r="3.5" fill="#34715f"/>
<circle cx="331.67" cy="186.35" r="3.5" fill="#34715f"/>
