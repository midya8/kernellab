<svg xmlns="http://www.w3.org/2000/svg" width="900" height="610" viewBox="0 0 900 610" role="img" aria-labelledby="title desc">
<title id="title">KernelLab finite-grid optimization: same evaluation budget</title>
<desc id="desc">Best observed deterministic objective by total evaluations, including three shared initial points. EI, farthest-point and one seeded random policy. Grid oracle is report-only.</desc>
<rect width="900" height="610" fill="#fff"/><g font-family="Arial,sans-serif" fill="#251f21">
<text x="40" y="40" font-size="28" font-weight="600">Same grid. Same evaluation budget.</text>
<text x="40" y="68" font-size="16" font-weight="400">Maximize sin(2x) + 0.4 cos(5x) - 0.05x^2 on 81 fixed candidates.</text>
<line x1="80" x2="835" y1="395.0" y2="395.0" stroke="#eae9ea"/>
<text x="43" y="400.0" font-size="14" font-weight="400">0.2</text>
