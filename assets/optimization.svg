<line x1="40" x2="67" y1="529" y2="529" stroke="#827b7d" stroke-width="3" stroke-dasharray="3 3"/>
<text x="80" y="534" font-size="15" font-weight="400">Uniform random, seed 29: best 0.646233; finite-grid regret 0.399473</text>
<text x="40" y="567" font-size="15" font-weight="400">One development objective and one random seed, not a general optimizer ranking.</text>
<text x="40" y="590" font-size="15" font-weight="400">EI: fixed kernel, latent variance, zero observation noise. Oracle never enters selection.</text>
